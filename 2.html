<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Hand Tracking Game</title>

    <!-- Load MediaPipe Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
      body {
        margin: 0;
        background: #0d0d1a;
        overflow: hidden;
        font-family: sans-serif;
        text-align: center;
      }
      #status {
        color: white;
        font-size: 18px;
        padding: 15px;
        background: rgba(0,0,0,0.8);
      }
      /* Fullscreen camera canvas container */
      #canvas-container {
        position: relative;
        width: 100vw;
        height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      video { display: none; }
      canvas {
        width: 100%;
        max-width: 640px;
        height: auto;
        border: 3px solid #00E5FF;
        border-radius: 12px;
        transform: scaleX(-1); /* Mirror view */
      }
    </style>
  </head>
  <body>

    <div id="status">Loading Camera & Hand Tracker...</div>

    <div id="canvas-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script>
      const videoElement = document.getElementById('webcam');
      const canvasElement = document.getElementById('output_canvas');
      const canvasCtx = canvasElement.getContext('2d');
      const statusMsg = document.getElementById('status');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        // Draw the camera frame onto the screen
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          statusMsg.innerText = "Hand Detected! Try Pinching.";
          const landmarks = results.multiHandLandmarks[0];

          // Draw green skeletal lines on hand
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
          drawLandmarks(canvasCtx, landmarks, { color: '#FF0055', lineWidth: 2 });

          // Get Thumb Tip (4) and Index Tip (8)
          const thumb = landmarks[4];
          const index = landmarks[8];

          // Calculate distance for pinch
          const distance = Math.hypot(thumb.x - index.x, thumb.y - index.y);

          if (distance < 0.08) {
            // SPELL CAST EFFECT: Draw a bright glowing magic circle on screen!
            statusMsg.innerText = "✨ SPELL CAST! (Pinch Active) ✨";
            
            canvasCtx.beginPath();
            canvasCtx.arc(index.x * canvasElement.width, index.y * canvasElement.height, 60, 0, 2 * Math.PI);
            canvasCtx.fillStyle = "rgba(255, 0, 85, 0.6)";
            canvasCtx.fill();
            canvasCtx.lineWidth = 5;
            canvasCtx.strokeStyle = "#FFFFFF";
            canvasCtx.stroke();
          }
        } else {
          statusMsg.innerText = "Show your hand to the camera";
        }
        canvasCtx.restore();
      });

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      camera.start().then(() => {
        statusMsg.innerText = "Camera Active! Show your hand.";
      }).catch(err => {
        statusMsg.innerText = "Camera Permission Denied or Failed!";
        console.error(err);
      });
    </script>
  </body>
</html>
