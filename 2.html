<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Controlled Background</title>

  <!-- MediaPipe Hand Tracking Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* Default Background: Dark Blue */
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d1a;
      color: #00E5FF;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
      transition: background-color 0.3s ease; /* Smooth color change */
    }

    #status {
      padding: 15px;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 2px solid #00E5FF;
      font-weight: bold;
    }

    #container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 60px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video { display: none; }

    canvas {
      width: 100%;
      max-width: 640px;
      height: auto;
      border: 3px solid #00E5FF;
      border-radius: 12px;
      background-color: #1a1a33;
      transform: scaleX(-1); /* Mirror view */
    }
  </style>
</head>
<body>

  <div id="status">Wave your hand to change the background!</div>

  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');

    // Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Run every frame
    hands.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Draw webcam feed onto canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Draw hand skeleton
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 3 });
        drawLandmarks(canvasCtx, landmarks, { color: '#FF0055', lineWidth: 2 });

        // ACTION IN BACKGROUND: Hand is present! Change background to Purple
        document.body.style.backgroundColor = "#4a0e4e"; 
        statusText.innerText = "✨ HAND DETECTED! Background changed to Magic Purple! ✨";
        statusText.style.color = "#FF0055";

      } else {
        // ACTION IN BACKGROUND: No hand. Reset to Dark Blue
        document.body.style.backgroundColor = "#0d0d1a";
        statusText.innerText = "Wave your hand to change the background...";
        statusText.style.color = "#00E5FF";
      }

      canvasCtx.restore();
    });

    // Start Camera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().then(() => {
      statusText.innerText = "Camera Active! Wave your hand.";
    }).catch(err => {
      statusText.innerText = "Camera Permission Denied!";
      console.error(err);
    });
  </script>
</body>
</html>
