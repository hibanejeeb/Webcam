<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Realm - AR Survival</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#camera, #game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#camera {
  transform: scaleX(-1);
  filter: brightness(.65);
}

#game { pointer-events: none; }

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  text-shadow: 0 0 10px cyan;
}

h2 { color: #65f7ff; margin: 0; }

button {
  padding: 12px 18px;
  background: #65f7ff;
  color: #06121b;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: rgba(3, 8, 22, .94);
  text-align: center;
  padding: 20px;
}

.panel {
  max-width: 500px;
  line-height: 1.6;
}

#status {
  position: fixed;
  bottom: 18px;
  left: 15px;
  right: 15px;
  text-align: center;
  color: #65f7ff;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="game"></canvas>

<div id="hud">
  <h2>ROOM REALM</h2>
  <div>
    ❤️ Health: <span id="health">100</span>
    &nbsp; | &nbsp;
    ⭐ Score: <span id="score">0</span>
  </div>
</div>

<div id="status">Start the game and allow camera access.</div>

<div id="startScreen">
  <div class="panel">
    <h1 style="color:#65f7ff">ROOM REALM</h1>
    <h3>Your room. Their realm.</h3>
    <p>
      Enemies invade your room! Aim using your index finger
      and pinch your thumb and index finger to shoot.
    </p>
    <button id="start">START GAME</button>
    <p id="message"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("camera");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let handModel, objectModel;
let enemies = [];
let particles = [];
let score = 0;
let health = 100;
let lastSpawn = 0;
let lastShot = 0;
let running = false;
let aiming = { x: innerWidth / 2, y: innerHeight / 2, pinch: false };
let furniture = [];

const furnitureTypes = [
  "couch", "chair", "dining table", "bed",
  "tv", "refrigerator", "potted plant", "bench"
];

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

function updateHUD() {
  document.getElementById("health").textContent = health;
  document.getElementById("score").textContent = score;
}

function spawnEnemy() {
  let x, y;

  if (furniture.length) {
    const obj = furniture[Math.floor(Math.random() * furniture.length)];
    const b = obj.bbox;

    // COCO-SSD uses the unmirrored video coordinates.
    const cx = innerWidth -
      (b[0] + b[2] / 2) / video.videoWidth * innerWidth;
    const cy = (b[1] + b[3] / 2) /
      video.videoHeight * innerHeight;

    const side = Math.floor(Math.random() * 4);
    const offset = 65;

    if (side === 0) {
      x = cx; y = cy - b[3] / 2 - offset;
    } else if (side === 1) {
      x = cx + b[2] / 2 + offset; y = cy;
    } else if (side === 2) {
      x = cx; y = cy + b[3] / 2 + offset;
    } else {
      x = cx - b[2] / 2 - offset; y = cy;
    }

    x = Math.max(25, Math.min(innerWidth - 25, x));
    y = Math.max(65, Math.min(innerHeight - 80, y));
  } else {
    // Fallback: spawn from the room's edges.
    const side = Math.floor(Math.random() * 4);
    x = side === 1 ? innerWidth - 25 :
        side === 3 ? 25 : Math.random() * innerWidth;
    y = side === 0 ? 70 :
        side === 2 ? innerHeight - 70 :
        Math.random() * innerHeight;
  }

  enemies.push({
    x, y,
    radius: 22,
    speed: 35 + Math.random() * 25 + score,
    phase: Math.random() * 6
  });
}

function shoot() {
  const now = performance.now();

  if (now - lastShot < 350 || !running) return;
  lastShot = now;

  let target = null;
  let distance = 55;

  for (const enemy of enemies) {
    const d = Math.hypot(
      enemy.x - aiming.x,
      enemy.y - aiming.y
    );

    if (d < distance) {
      distance = d;
      target = enemy;
    }
  }

  if (target) {
    enemies = enemies.filter(e => e !== target);
    score++;
    updateHUD();
    burst(target.x, target.y);
    document.getElementById("status").textContent = "NICE SHOT!";
  } else {
    particles.push({
      x: innerWidth / 2,
      y: innerHeight - 50,
      tx: aiming.x,
      ty: aiming.y,
      life: 0.2,
      shot: true
    });
  }
}

function burst(x, y) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - .5) * 180,
      vy: (Math.random() - .5) * 180,
      life: .6,
      color: "#ff4d8d"
    });
  }
}

function drawEnemy(e, now) {
  const pulse = 1 + Math.sin(now / 120 + e.phase) * .08;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(pulse, pulse);
  ctx.shadowBlur = 22;
  ctx.shadowColor = "#ff287a";

  const gradient = ctx.createRadialGradient(
    -7, -8, 2, 0, 0, e.radius
  );
  gradient.addColorStop(0, "#ffd4ec");
  gradient.addColorStop(.4, "#ff4d8d");
  gradient.addColorStop(1, "#55113f");

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(-7, -4, 5, 0, Math.PI * 2);
  ctx.arc(7, -4, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#22051a";
  ctx.beginPath();
  ctx.arc(-7, -4, 2, 0, Math.PI * 2);
  ctx.arc(7, -4, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function render(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Aim reticle
  ctx.strokeStyle = "#65f7ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(aiming.x, aiming.y, 16, 0, Math.PI * 2);
  ctx.stroke();

  for (const e of enemies) drawEnemy(e, now);

  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color || "#65f7ff";
    ctx.shadowBlur = 12;
    ctx.shadowColor = ctx.fillStyle;

    if (p.shot) {
      ctx.strokeStyle = "#65f7ff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.tx, p.ty);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

let previous = performance.now();

function loop(now) {
  const dt = Math.min((now - previous) / 1000, .05);
  previous = now;

  if (running) {
    if (now - lastSpawn > Math.max(650, 1800 - score * 40)) {
      spawnEnemy();
      lastSpawn = now;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];

      const dx = innerWidth / 2 - e.x;
      const dy = innerHeight - 80 - e.y;
      const distance = Math.hypot(dx, dy) || 1;

      e.x += dx / distance * e.speed * dt;
      e.y += dy / distance * e.speed * dt;

      if (distance < 40) {
        enemies.splice(i, 1);
        health = Math.max(0, health - 12);
        updateHUD();

        if (health === 0) {
          running = false;
          document.getElementById("status").textContent =
            "GAME OVER! Reload the page to play again.";
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      if (!p.shot) {
        p.x += (p.vx || 0) * dt;
        p.y += (p.vy || 0) * dt;
      }

      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

async function trackHands() {
  if (!running || !handModel) return;

  if (video.readyState >= 2) {
    const result = handModel.detectForVideo(
      video, performance.now()
    );

    if (result.landmarks.length) {
      const lm = result.landmarks[0];
      const index = lm[8];
      const thumb = lm[4];

      aiming.x = (1 - index.x) * innerWidth;
      aiming.y = index.y * innerHeight;

      const pinch = Math.hypot(
        index.x - thumb.x,
        index.y - thumb.y
      ) < .055;

      if (pinch && !aiming.pinch) shoot();
      aiming.pinch = pinch;
    } else {
      aiming.pinch = false;
    }
  }

  requestAnimationFrame(trackHands);
}

async function scanRoom() {
  if (!running || !objectModel) return;

  try {
    const predictions = await objectModel.detect(video);
    furniture = predictions.filter(p =>
      furnitureTypes.includes(p.class) && p.score > .5
    );
  } catch (err) {
    console.error("Object detection error:", err);
  }

  setTimeout(scanRoom, 800);
}

document.getElementById("start").addEventListener("click", async () => {
  const button = document.getElementById("start");
  const message = document.getElementById("message");

  button.disabled = true;
  message.textContent = "Starting camera and loading AI models…";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    await tf.ready();
    objectModel = await cocoSsd.load();

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    handModel = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },
      runningMode: "VIDEO",
      numHands: 1
    });

    document.getElementById("startScreen").style.display = "none";
    running = true;
    lastSpawn = performance.now();

    document.getElementById("status").textContent =
      "Point your index finger and pinch to shoot!";

    trackHands();
    scanRoom();

  } catch (error) {
    message.textContent =
      "Could not start: " + error.message +
      ". Allow camera access and use HTTPS.";
    button.disabled = false;
  }
});
</script>

</body>
</html>
