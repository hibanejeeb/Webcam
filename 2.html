<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Test</title>
  <style>
    /* 1. Dark night background */
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d1a;
      color: #00E5FF;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* 2. Top status message */
    #status {
      padding: 15px;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid #00E5FF;
    }

    /* 3. Fullscreen canvas */
    canvas {
      display: block;
      margin: 20px auto;
      border: 3px solid #00E5FF;
      border-radius: 12px;
      background-color: #1a1a33;
    }
  </style>
</head>
<body>

  <div id="status">Tap the box below to Cast Spell!</div>
  <canvas id="gameCanvas" width="320" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let isPinching = false;

    // Draw function
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (isPinching) {
        // PINCH / TAP ACTIVE: Pink Glowing Spell
        ctx.beginPath();
        ctx.arc(160, 200, 70, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(255, 0, 85, 0.7)";
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();

        statusText.innerText = "✨ SPELL CAST! ✨";
        statusText.style.color = "#FF0055";
      } else {
        // DEFAULT STATE: Cyan Blue Sphere
        ctx.beginPath();
        ctx.arc(160, 200, 40, 0, 2 * Math.PI);
        ctx.fillStyle = "#00E5FF";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();

        statusText.innerText = "Tap the box below to Cast Spell!";
        statusText.style.color = "#00E5FF";
      }
    }

    // Event listeners to simulate pinch gesture via screen tap/click
    canvas.addEventListener('pointerdown', () => { isPinching = true; draw(); });
    canvas.addEventListener('pointerup', () => { isPinching = false; draw(); });

    // Initial render
    draw();
  </script>
</body>
</html>
